# Example permissions store for approval-gated actions.
#
# Two files are merged, like hooks:
#   1. The runtime permissions.yaml next to daemon.yaml (this layout). It is
#      mutable: an "Always allow" or "Always deny" prompt appends here and it
#      survives restarts.
#   2. An optional, read-only <workspace_dir>/.tsugite/permissions.yaml, hand
#      authored per agent (same layout). The store never writes it.
#
# Every list below is read from BOTH files.

web:
  # Domains the webpage detector may fetch without asking for approval.
  fetch_allowlist:
    - example.com
  # Domains it never fetches and never asks about. Checked before the allowlist.
  fetch_denylist:
    - ads.example.com
