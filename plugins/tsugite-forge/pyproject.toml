[project]
name = "tsugite-forge"
version = "0.27.1"
description = "Tsugite plugin: read pull requests from Forgejo and GitHub"
authors = [{ name = "Justyn Shull" }]
requires-python = ">=3.11"
dependencies = [
  "tsugite-cli==0.27.1",
  "tsugite-daemon==0.27.1",
]

[project.entry-points."tsugite.plugins"]
forge = "tsugite_forge.tools"

[project.entry-points."tsugite.adapters"]
forge = "tsugite_forge.adapter:create_adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsugite_forge"]

[tool.hatch.build.targets.sdist]
include = [
  "/tsugite_forge",
  "/pyproject.toml",
]

[tool.uv.sources]
tsugite-cli = { workspace = true }
tsugite-daemon = { workspace = true }
