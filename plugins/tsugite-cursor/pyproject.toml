[project]
name = "tsugite-cursor"
version = "0.27.0"
description = "Tsugite plugin: Cursor provider (routes LLM calls through the Cursor Python SDK)"
authors = [{ name = "Justyn Shull" }]
requires-python = ">=3.11"
dependencies = [
  "cursor-sdk>=1.3.1,<2",
  "tsugite-cli==0.27.0",
]

[project.entry-points."tsugite.providers"]
cursor = "tsugite_cursor:create_provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsugite_cursor"]

[tool.hatch.build.targets.sdist]
include = [
  "/tsugite_cursor",
  "/pyproject.toml",
]

[tool.uv.sources]
tsugite-cli = { workspace = true }
