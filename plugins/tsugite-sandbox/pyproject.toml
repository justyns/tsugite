[project]
name = "tsugite-sandbox"
version = "0.25.4"
description = "Tsugite plugin: Hozo sandbox backend (default-installed)"
authors = [{ name = "Justyn Shull" }]
requires-python = ">=3.11"
dependencies = ["tsugite-cli==0.25.4", "hozo>=0.5.2"]

[project.entry-points."tsugite.sandbox"]
hozo = "tsugite_sandbox:HozoSandbox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsugite_sandbox"]

[tool.hatch.build.targets.sdist]
include = [
  "/tsugite_sandbox",
  "/pyproject.toml",
]

[tool.uv.sources]
tsugite-cli = { workspace = true }
