[project]
name = "tsugite-onlyoffice"
version = "0.20.0"
description = "Tsugite plugin: collaborative document editing through an ONLYOFFICE Docs server"
authors = [{ name = "Justyn Shull" }]
requires-python = ">=3.11"
dependencies = [
  "tsugite-cli==0.20.0",
  "tsugite-daemon==0.20.0",
]

[project.entry-points."tsugite.plugins"]
onlyoffice = "tsugite_onlyoffice.tools"

[project.entry-points."tsugite.adapters"]
onlyoffice = "tsugite_onlyoffice.adapter:create_adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsugite_onlyoffice"]

[tool.hatch.build.targets.sdist]
include = [
  "/tsugite_onlyoffice",
  "/pyproject.toml",
]

[tool.uv.sources]
tsugite-cli = { workspace = true }
tsugite-daemon = { workspace = true }
