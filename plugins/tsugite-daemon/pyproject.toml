[project]
name = "tsugite-daemon"
version = "0.21.1"
description = "Tsugite plugin: daemon stack (HTTP/web UI, scheduler, jobs, sessions, notifications)"
authors = [{ name = "Justyn Shull" }]
requires-python = ">=3.11"
dependencies = [
  "tsugite-cli==0.21.1",
  "tsugite-pty==0.21.1",
  "tsugite-sandbox==0.21.1",
  "cronsim>=2.6",
  "starlette>=0.36",
  "uvicorn>=0.25",
  "python-multipart>=0.0.9",
  "pywebpush>=2.0.0",
  "py-vapid>=1.9.0",
]

[project.entry-points."tsugite.context_providers"]
daemon = "tsugite_daemon.context"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built web UI (tsugite_daemon/web/) is gitignored build output, and
# hatchling excludes VCS-ignored files by default. `artifacts` re-includes it
# so wheels/sdists ship the UI - publish pipelines must run the frontend build
# (npm --prefix plugins/tsugite-daemon/frontend run build) before `uv build`.
artifacts = ["tsugite_daemon/web"]

[tool.hatch.build.targets.wheel]
packages = ["tsugite_daemon"]

[tool.hatch.build.targets.sdist]
include = [
  "/tsugite_daemon",
  "/pyproject.toml",
]

[tool.uv.sources]
tsugite-cli = { workspace = true }
tsugite-pty = { workspace = true }
tsugite-sandbox = { workspace = true }
