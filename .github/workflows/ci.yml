name: CI

# Portability note: keep `uses:` refs bare (`actions/checkout@v4`, never a full
# URL) and avoid third-party actions. uv installs from its own script and fetches
# the interpreter itself, so no setup-python step is needed and the jobs behave
# the same on hosted and self-hosted runners.

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --dev --all-extras --python 3.12

      - name: Run ruff check
        run: uv run ruff check --show-fixes .

      - name: Run ruff format
        run: uv run ruff format --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --dev --all-extras --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -v

      # Artifact storage is a GitHub-hosted service; uploading elsewhere fails.
      - name: Upload coverage reports
        if: matrix.python-version == '3.12' && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/tsugite-daemon/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: plugins/tsugite-daemon/frontend/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npx playwright install --with-deps chromium

      - run: npm run test:browser

      - run: npm run build
