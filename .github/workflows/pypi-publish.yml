name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    # Needs GitHub-hosted services (trusted publishing, Releases).
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required for creating GitHub releases
      id-token: write    # Required for PyPI trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history so auto-generated release notes can diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: plugins/tsugite-daemon/frontend/package-lock.json

      # The web UI dist is gitignored build output. The tsugite-daemon wheel
      # bundles it (hatch `artifacts`), and it must exist before packaging.
      - name: Build web UI
        run: npm ci && npm run build
        working-directory: plugins/tsugite-daemon/frontend

      - name: Build all workspace packages
        run: uv build --all-packages

      - name: Publish to PyPI
        # Trusted publishing: each package (tsugite-cli, tsugite-tmux, ...) must be
        # registered separately on PyPI as a trusted publisher pointing at this workflow.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # skip-existing tolerates partial re-runs. If some packages of a
          # version are already uploaded (one package's trusted publisher
          # wasn't registered yet and was fixed, say), this skips those
          # instead of erroring on the duplicate.
          skip-existing: true

      - name: Generate release notes from conventional commits
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub release
        # Only on a real tag push. A manual workflow_dispatch on a branch has
        # no tag for the release to attach to.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          # TODO: Do I want to readd this?
          # files: |
          #   dist/*.whl
          #   dist/*.tar.gz
          #   dist/*.publish.attestation

  desktop:
    if: github.server_url == 'https://github.com'
    needs: build-and-publish
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            dist: dist:linux
            files: desktop/out/*.AppImage desktop/out/*.tar.gz
          - os: macos-14
            target: macos-aarch64
            dist: dist:mac
            files: desktop/out/*.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            plugins/tsugite-daemon/frontend/package-lock.json
            desktop/package-lock.json

      - name: Build the bundled runtime
        run: python3 packaging/runtime/build.py --target ${{ matrix.target }}

      - name: Check the runtime
        run: |
          packaging/runtime/smoke.sh dist/runtime/${{ matrix.target }}
          if [ "${{ matrix.target }}" = macos-aarch64 ]; then packaging/runtime/check-macos.sh dist/runtime/macos-aarch64; fi

      - name: Package the app
        working-directory: desktop
        run: |
          npm ci
          npm version "$(python3 -c 'import tomllib; print(tomllib.load(open("../pyproject.toml", "rb"))["project"]["version"])')" --no-git-tag-version --allow-same-version
          npm run ${{ matrix.dist }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/out/*.AppImage
            desktop/out/*.tar.gz
            desktop/out/*.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber
