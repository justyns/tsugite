name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    # Needs GitHub-hosted services (trusted publishing, Releases).
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required for creating GitHub releases
      id-token: write    # Required for PyPI trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # Full history so auto-generated release notes can diff

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: plugins/tsugite-daemon/frontend/package-lock.json

      # The web UI dist is gitignored build output. The tsugite-daemon wheel
      # bundles it (hatch `artifacts`), and it must exist before packaging.
      - name: Build web UI
        run: npm ci && npm run build
        working-directory: plugins/tsugite-daemon/frontend

      - name: Build all workspace packages
        run: uv build --all-packages

      - name: Publish to PyPI
        # Trusted publishing: each package (tsugite-cli, tsugite-tmux, ...) must be
        # registered separately on PyPI as a trusted publisher pointing at this workflow.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # skip-existing tolerates partial re-runs. If some packages of a
          # version are already uploaded (one package's trusted publisher
          # wasn't registered yet and was fixed, say), this skips those
          # instead of erroring on the duplicate.
          skip-existing: true

      - name: Generate release notes from conventional commits
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub release
        # Only on a real tag push. A manual workflow_dispatch on a branch has
        # no tag for the release to attach to.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body: ${{ steps.changelog.outputs.content }}
          # TODO: Do I want to readd this?
          # files: |
          #   dist/*.whl
          #   dist/*.tar.gz
          #   dist/*.publish.attestation

  desktop:
    if: github.server_url == 'https://github.com'
    needs: build-and-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            dist: dist:linux
            files: desktop/out/*.AppImage
          - os: macos-15
            target: macos-aarch64
            dist: dist:mac
            files: desktop/out/*.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            plugins/tsugite-daemon/frontend/package-lock.json
            desktop/package-lock.json

      - name: Build the bundled runtime
        run: python3 packaging/runtime/build.py --target ${{ matrix.target }}

      - name: Check the runtime
        run: |
          packaging/runtime/smoke.sh dist/runtime/${{ matrix.target }}
          if [ "${{ matrix.target }}" = macos-aarch64 ]; then packaging/runtime/check-macos.sh dist/runtime/macos-aarch64; fi

      - name: Package the app
        working-directory: desktop
        run: |
          npm ci
          npm version "$(python3 -c 'import tomllib; print(tomllib.load(open("../pyproject.toml", "rb"))["project"]["version"])')" --no-git-tag-version --allow-same-version
          npm run ${{ matrix.dist }} -- --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/out/*.AppImage
            desktop/out/*.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber
