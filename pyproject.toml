[project]
name = "tsugite-cli"
version = "0.21.1"
description = "Micro-agent runner for task automation using markdown definitions"
authors = [{ name = "Justyn Shull" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["agents", "automation", "cli", "jinja2"]
dependencies = [
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.25",
  "rich>=13.0",
  "questionary>=2.1.1",
  "html2text>=2020.1.16",
  "tiktoken>=0.7.0",
  "pydantic>=2.12.3",
  "pathspec>=0.11.0",
  "prompt-toolkit>=3.0.43",
  "portalocker>=2.8.0",
  "tzlocal>=5.3.1",
  "cryptography>=46.0.5",
  "nest_asyncio>=1.5.0",
]

[project.optional-dependencies]
web = [
  "tsugite-web",
  "tsugite-youtube",
]
sandbox = [
  "tsugite-sandbox",
]
daemon = [
  "tsugite-daemon",
  "tsugite-discord",
]
discord = [
  "tsugite-discord",
]
claude-code = [
  "tsugite-claude-code",
]
all = [
  "tsugite-web",
  "tsugite-youtube",
  "tsugite-sandbox",
  "tsugite-pty",
  "tsugite-daemon",
  "tsugite-discord",
  "tsugite-tmux",
  "tsugite-acp",
  "tsugite-claude-code",
  "tsugite-codex-cli",
]

[project.scripts]
tsugite = "tsugite.tsugite:app"
tsu = "tsugite.tsugite:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsugite"]

[tool.hatch.build.targets.sdist]
include = [
  "/tsugite",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/AGENTS.md",
  "/pyproject.toml",
]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
tsugite-cli = { workspace = true }
tsugite-tmux = { workspace = true }
tsugite-acp = { workspace = true }
tsugite-claude-code = { workspace = true }
tsugite-codex-cli = { workspace = true }
tsugite-web = { workspace = true }
tsugite-youtube = { workspace = true }
tsugite-sandbox = { workspace = true }
tsugite-pty = { workspace = true }
tsugite-daemon = { workspace = true }
tsugite-discord = { workspace = true }
tsugite-cc-driver = { workspace = true }
tsugite-onlyoffice = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
  "E501", # Line too long (handled by black)
  "F821", # Undefined name in string type annotations (forward refs)
]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
addopts = "-n auto --dist loadfile --cov=tsugite --cov-report=term-missing --cov-report=html --cov-report=xml"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::RuntimeWarning"]
norecursedirs = [
  '.*',
  'build',
  'dist',
  'CVS',
  '_darcs',
  '{arch}',
  '*.egg',
  '_*',
  'integration',
  'e2e',
]

[tool.coverage.run]
source = ["tsugite", "tsugite_web", "tsugite_youtube", "tsugite_sandbox", "tsugite_pty", "tsugite_daemon", "tsugite_discord"]
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.pylint]
disable = [
  "line-too-long",
  "missing-function-docstring",
  "missing-module-docstring",
  "invalid-name",
]
ignore = [".venv", "docs", "tests"]

# Dead-code scan config for `mise run deadcode` (which also runs the frontend
# knip pass). Confidence 60 is needed to surface unused methods/attributes, but
# that pulls in whole classes of framework callbacks reached dynamically (never
# by a direct call), so the decorator/name lists below suppress those classes to
# leave a signal of genuinely-unreachable code. Tests are excluded from triage.
[tool.vulture]
min_confidence = 60
paths = [
  "tsugite",
  "plugins/tsugite-acp/tsugite_acp",
  "plugins/tsugite-cc-driver/tsugite_cc_driver",
  "plugins/tsugite-claude-code/tsugite_claude_code",
  "plugins/tsugite-codex-cli/tsugite_codex_cli",
  "plugins/tsugite-daemon/tsugite_daemon",
  "plugins/tsugite-discord/tsugite_discord",
  "plugins/tsugite-onlyoffice/tsugite_onlyoffice",
  "plugins/tsugite-pty/tsugite_pty",
  "plugins/tsugite-sandbox/tsugite_sandbox",
  "plugins/tsugite-tmux/tsugite_tmux",
  "plugins/tsugite-web/tsugite_web",
  "plugins/tsugite-youtube/tsugite_youtube",
]
exclude = ["*/tests/*", "*/test_*.py"]
ignore_decorators = [
  "@*.command",        # typer CLI subcommands (tsugite/cli/*)
  "@*.callback",       # typer app callbacks
  "@tool",             # agent tools (tsugite/tools/*), invoked by name from the registry
  "@field_validator",  # pydantic
  "@model_validator",  # pydantic
  "@*.event",          # discord.py gateway events (on_ready/on_message/on_error)
  "@*.button",         # discord.py UI buttons
  "@kb.add",           # prompt_toolkit key bindings (repl Ctrl-C handler)
]
ignore_names = [
  "cmd_*",             # daemon chat commands, dispatched from a name registry
  "_handle_*",         # UI event handlers, dispatched via an event->method-name map
  "_validate_*",       # pydantic validators
  "model_config",      # pydantic model settings
  "on_*",              # discord/lifecycle callbacks (on_submit, on_ready, on_connect, ...)
  "interaction_check", # discord.py View/Modal permission hook
  "create_adapter",    # plugin entry points (pyproject [project.entry-points])
  "create_handler",
  "get_public_http_routes",
  "get_http_routes",
  "install_signal_handlers",  # uvicorn.Config attributes, set by name
  "should_exit",
  "force_exit",
  "CLI",               # SessionSource member matching the raw "cli" agent_runner writes into session data
  # acp.Client protocol handlers - the acp library dispatches these by
  # getattr(handler, "<name>") string lookup (acp/client/router.py), never by a
  # direct in-repo call.
  "session_update",
  "request_permission",
  "read_text_file",
  "write_text_file",
  "create_terminal",
  "terminal_output",
  "release_terminal",
  "wait_for_terminal_exit",
  "kill_terminal",
  "ext_method",
  "ext_notification",
  # pydantic HooksConfig phase fields, fired via getattr(config, phase) in the hook runner.
  "pre_compact",
  "post_compact",
  "pre_message",
  "pre_context_build",
  "post_context_build",
  "pre_response",
  "post_response",
  "session_end",
  "hook",              # @hook decorator-registry, the public plugin hook API
  # Framework-owned attributes read by the library, not by tsugite code.
  "message_content",   # discord.py privileged Intents flag
  "row_factory",       # sqlite3.Connection attribute, consumed by the C layer
  "ignore_links",      # html2text.HTML2Text config attributes
  "ignore_images",
  "body_width",
  "get_completions",   # prompt_toolkit Completer API, dispatched by the session
  "complete_event",    # mandatory prompt_toolkit get_completions() parameter
  "language",          # CodeExecutionEvent field, read by the web UI via serialized events
  "BubblewrapSandbox", # plugin entry point (tsugite.sandbox: bwrap), loaded via get_sandbox_class
  # Public API / test-infra reached only from tests (vulture excludes tests).
  "subscribe_filtered",         # imperative EventBus filtered-subscription API (docs/plugin-events.md)
  "unsubscribe_filtered",
  "supports_audio",             # ModelInfo field populated from OpenRouter metadata
  "save_schema",                # called by scripts/regenerate_schema.py (scripts/ not scanned)
  "wait_drain",                 # PtyProcess test-synchronization primitive
  "close_all",                  # sqlite connection-cache cleanup used by test fixtures
  "reset_attachment_handlers",  # attachment-registry reset used by test fixtures
]

[dependency-groups]
dev = [
  "black>=25.9.0",
  "pylint>=4.0.2",
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=6.0.0",
  "pytest-playwright>=0.7.2",
  "pytest-xdist>=3.5.0",
  "ruff>=0.1",
  "vulture>=2.14",
  "tsugite-tmux",
  "tsugite-acp",
  "tsugite-claude-code",
  "tsugite-codex-cli",
  "tsugite-web",
  "tsugite-youtube",
  "tsugite-sandbox",
  "tsugite-pty",
  "tsugite-daemon",
  "tsugite-discord",
  "tsugite-cc-driver",
  "tsugite-onlyoffice",
]
